<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Azure Manhwa – Baca Komik</title>

<style>
body{
  margin:0;
  font-family:system-ui,sans-serif;
  background:#0b0f14;
  color:#fff;
}

/* HEADER */
header{
  padding:16px;
  background:#020617;
  text-align:center;
}

.logo{
  font-size:28px;
  font-weight:900;
  color:#4cc2ff;
  text-shadow:0 0 16px #4cc2ff;
}

.subtitle{
  font-size:13px;
  color:#9ca3af;
}

/* INFO */
.info{
  padding:12px;
}
.rate{
  color:#ffcc00;
  font-size:14px;
}

/* WARNING */
.warn{
  display:none;
  background:#220000;
  color:#ffbaba;
  padding:10px;
  border-radius:8px;
  margin:12px;
  font-size:13px;
}

/* READER */
.reader{
  padding:10px;
}
.reader img{
  width:100%;
  margin-bottom:10px;
  border-radius:8px;
}

/* NAV */
.nav{
  display:flex;
  justify-content:space-between;
  padding:10px;
}
.btn{
  background:#1f2937;
  border:none;
  color:#fff;
  padding:8px 14px;
  border-radius:10px;
}

/* COMMENT */
.comment-box{
  padding:12px;
}
.comment-box textarea{
  width:100%;
  padding:8px;
  border-radius:8px;
  border:none;
  background:#111827;
  color:#fff;
}
.comment-box button{
  margin-top:6px;
  width:100%;
  background:#3b82f6;
  border:none;
  padding:8px;
  border-radius:8px;
  color:#fff;
}

.comment{
  background:#111827;
  margin:10px 12px;
  padding:10px;
  border-radius:10px;
  font-size:13px;
}
.reply{
  margin-top:6px;
  margin-left:12px;
  border-left:2px solid #1f2937;
  padding-left:8px;
  color:#d1d5db;
}

/* SUPPORT */
.support{
  margin:12px;
  padding:14px;
  border-radius:14px;
  background:linear-gradient(135deg,#1e3a8a,#020617);
  text-align:center;
  box-shadow:0 0 15px rgba(59,130,246,.6);
}

/* FOOTER */
footer{
  text-align:center;
  padding:12px;
  font-size:12px;
  color:#9ca3af;
}
</style>
</head>

<body>

<header>
  <div class="logo">Azure Manhwa</div>
  <div class="subtitle">Judul Komik – Chapter 1</div>
</header>

<div class="info">
  <p class="rate">⭐ 4.8</p>
  <p>Genre: <b id="genreText">Fantasy</b></p>
</div>

<div id="warn" class="warn">
⚠️ Konten ini mengandung genre dewasa. Baca dengan bijak.
</div>

<!-- READER -->
<div class="reader">
  <!-- GANTI LINK GAMBAR DI SINI -->
  <img src="https://via.placeholder.com/800x1200">
  <img src="https://via.placeholder.com/800x1200">
</div>

<div class="nav">
  <button class="btn">⟵ Prev</button>
  <button class="btn">Next ⟶</button>
</div>

<!-- KOMENTAR -->
<div class="comment-box">
  <h3>Komentar</h3>
  <textarea id="text" placeholder="Tulis komentar..."></textarea>
  <button onclick="send()">Kirim</button>
</div>

<div id="list"></div>

<!-- SUPPORT -->
<div class="support">
  <p>💙 Dukung Azure Manhwa</p>
  <p>DANA: <b>085600195762</b></p>
</div>

<footer>
© Azure Manhwa
</footer>

<script>
/* ===== SETTING KOMIK ===== */
const GENRE = "Smut";   // GANTI: Fantasy / Romance / Smut / Adult
const KEY = "azure_comment";

/* WARNING */
if(GENRE==="Smut" || GENRE==="Adult"){
  document.getElementById("warn").style.display="block";
}
document.getElementById("genreText").innerText = GENRE;

/* KOMENTAR */
let data = JSON.parse(localStorage.getItem(KEY) || "[]");

function render(){
  const wrap=document.getElementById("list");
  wrap.innerHTML="";
  data.forEach((c,i)=>{
    let html=`<div class="comment">
      <b>Anonim</b><br>${c.text}
      <br><button class="btn" onclick="reply(${i})">Balas</button>`;
    if(c.reply){
      c.reply.forEach(r=>{
        html+=`<div class="reply">${r}</div>`;
      });
    }
    html+=`</div>`;
    wrap.innerHTML+=html;
  });
}

function send(){
  const t=document.getElementById("text");
  if(!t.value)return;
  data.push({text:t.value,reply:[]});
  localStorage.setItem(KEY,JSON.stringify(data));
  t.value="";
  render();
}

function reply(i){
  const r=prompt("Balas komentar:");
  if(!r)return;
  data[i].reply.push(r);
  localStorage.setItem(KEY,JSON.stringify(data));
  render();
}

render();
</script>

</body>
  </html>
