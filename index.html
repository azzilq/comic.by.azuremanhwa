<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Azure Manhwa</title>
<meta name="description" content="Azure Manhwa - Baca manhwa, manhua, manga gratis update terbaru.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;background:#0b0b0f;color:#fff;font-family:sans-serif}
header{padding:15px;text-align:center}
.logo{font-size:26px;font-weight:bold;color:#4cc2ff;text-shadow:0 0 12px #4cc2ff}
input,select{width:95%;margin:5px;padding:10px;background:#15151f;color:#fff;border:none;border-radius:6px}
.list{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:10px}
.card{background:#111;border-radius:8px;overflow:hidden}
.card img{width:100%}
.card p{margin:5px;font-size:13px}
.badge{color:#ff4c9e;font-size:11px}
footer{padding:15px;text-align:center;font-size:12px;color:#aaa}
a{color:#4cc2ff;text-decoration:none}
</style>
</head>
<body>

<header>
  <div class="logo">Azure Manhwa</div>
  <input id="search" placeholder="Search manhwa...">
  <select id="genre">
    <option value="">All Genre</option>
    <option>Action</option><option>Romance</option><option>Fantasy</option>
    <option>Drama</option><option>Comedy</option><option>School</option>
    <option>Harem</option><option>Smut</option><option>Adult</option>
  </select>
</header>

<div class="list" id="list">
  <!-- KOMIK KOSONG DULU -->
  <!-- CONTOH -->
  <div class="card" data-genre="Smut">
    <a href="post.html">
      <img src="https://via.placeholder.com/300x420">
      <p>Judul Komik</p>
      <p class="badge">New Chapter</p>
    </a>
  </div>
</div>

<footer>
  <p>Info & Lapor Bug</p>
  <a href="https://t.me/+Yi-oZzIE-bplZWE9">Telegram</a> •
  <a href="https://www.tiktok.com/@shereebourgade">TikTok</a>
</footer>

<script>
const search=document.getElementById("search");
const genre=document.getElementById("genre");
const cards=document.querySelectorAll(".card");

function filter(){
  cards.forEach(c=>{
    const matchTitle=c.innerText.toLowerCase().includes(search.value.toLowerCase());
    const matchGenre=!genre.value||c.dataset.genre===genre.value;
    c.style.display=(matchTitle&&matchGenre)?"block":"none";
  })
}
search.oninput=filter;
genre.onchange=filter;
</script>

</body>
    </html>
