<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Azure Manhwa</title>
<meta name="description" content="Azure Manhwa - Baca manhwa gratis">
<style>
body{
margin:0;
background:#05070c;
color:#e5e7eb;
font-family:Arial;
}
header{
padding:15px;
text-align:center;
font-size:26px;
color:#7dd3fc;
text-shadow:0 0 12px #38bdf8;
}
.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
padding:10px;
  <input id="search" placeholder="Cari komik..."
style="width:90%;margin:10px;padding:8px;border-radius:10px">

<select id="genre" style="margin:10px;padding:8px">
<option>All</option>
<option>Action</option>
<option>Romance</option>
<option>Drama</option>
<option>Fantasy</option>
<option>Josei</option>
<option>Adult</option>
<option>Comedy</option>
<option>Horror</option>
<option>Isekai</option>
<option>Full Color</option>
</select>
}
.card{
background:#0b1220;
border-radius:12px;
padding:40px 10px;
text-align:center;
box-shadow:0 0 10px rgba(56,189,248,.15);
}
nav{
position:fixed;
bottom:0;
width:100%;
background:#020617;
display:flex;
justify-content:space-around;
padding:8px 0;
}
a{color:#7dd3fc;text-decoration:none;font-size:12px}
</style>
</head>
<body>

<header>Azure Manhwa</header>

<div class="grid">
<div class="card">Coming Soon</div>
<div class="card">Coming Soon</div>
<div class="card">Coming Soon</div>
<div class="card">Coming Soon</div>
<div class="card">Coming Soon</div>
<div class="card">Coming Soon</div>
</div>

<nav>
<a href="#">Beranda</a>

</nav>

  <a href="reader.html">
  <div class="card">Coming Soon</div>
  </a>
  
  <script>
const cards = document.querySelectorAll(".card");
document.getElementById("search").oninput = function(){
cards.forEach(c=>{
c.style.display =
c.innerText.toLowerCase().includes(this.value.toLowerCase())
? "block":"none";
});
}
  </script>
  
</body>
</html>
