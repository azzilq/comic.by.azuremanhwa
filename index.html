<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Azure Manhwa</title>
<meta name="description" content="Azure Manhwa - baca manhwa, manhua, manga update terbaru">

<style>
body{
  margin:0;
  font-family:system-ui,sans-serif;
  background:#0b0f14;
  color:#fff;
}

/* HEADER */
header{
  padding:16px;
  background:#020617;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:34px;
  font-weight:900;
  color:#4cc2ff;
  text-shadow:0 0 18px #4cc2ff;
  margin-bottom:10px;
}

.tools{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

input,select{
  padding:8px;
  border-radius:8px;
  border:none;
  background:#111827;
  color:#fff;
  font-size:13px;
}

/* WARNING */
#warn{
  display:none;
  background:#220000;
  color:#ffbaba;
  padding:10px;
  margin:10px;
  border-radius:8px;
  font-size:13px;
}

/* LIST */
#list{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  padding:12px;
}

.card{
  background:#111827;
  border-radius:14px;
  overflow:hidden;
  text-decoration:none;
  color:#fff;
  position:relative;
}

.card img{
  width:100%;
  display:block;
}

.card p{
  margin:6px 8px;
  font-size:13px;
}

.rate{
  color:#ffcc00;
  font-size:12px;
}

.badge{
  position:absolute;
  top:8px;
  left:8px;
  background:#3b82f6;
  padding:2px 6px;
  font-size:10px;
  border-radius:6px;
}

/* FOOTER */
footer{
  padding:14px;
  text-align:center;
  font-size:12px;
  color:#9ca3af;
}
footer a{color:#4cc2ff;text-decoration:none}
</style>
</head>

<body>

<header>
  <div class="logo">Azure Manhwa</div>

  <div class="tools">
    <input id="search" placeholder="Search...">

    <select id="genre">
      <option value="">All Genre</option>
      <option>Action</option><option>Adventure</option><option>Comedy</option>
      <option>Drama</option><option>Fantasy</option><option>Magic</option>
      <option>Romance</option><option>School</option><option>Slice of Life</option>
      <option>Supernatural</option><option>Mystery</option><option>Psychological</option>
      <option>Thriller</option><option>Horror</option><option>Historical</option>
      <option>Martial Arts</option><option>Shounen</option><option>Shoujo</option>
      <option>Josei</option><option>Seinen</option><option>Demon</option>
      <option>Vampire</option><option>Mythology</option><option>Reincarnation</option>
      <option>Isekai</option><option>Game</option><option>System</option>
      <option>Overpowered</option><option>Villainess</option><option>Kingdom</option>
      <option>War</option><option>Crime</option><option>Medical</option>
      <option>Sports</option><option>Cooking</option><option>Office</option>
      <option>Marriage</option><option>Harem</option>
      <option>Smut</option><option>Adult</option>
    </select>

    <select id="rating">
      <option value="0">All Rating</option>
      <option value="4">⭐ 4.0+</option>
      <option value="4.5">⭐ 4.5+</option>
      <option value="5">⭐ 5.0</option>
    </select>

    <select id="sort">
      <option value="new">Terbaru</option>
      <option value="rate">Rating Tertinggi</option>
    </select>
  </div>
</header>

<div id="warn">
⚠️ Konten ini mengandung genre dewasa. Baca dengan bijak.
</div>

<!-- LIST KOMIK -->
<div id="list">

<a href="post.html" class="card" data-genre="Fantasy" data-rating="4.8">
  <img src="https://via.placeholder.com/300x420">
  <span class="badge">NEW</span>
  <p>Coming Soon</p>
  <p class="rate">⭐ 4.8</p>
</a>

<a href="post.html" class="card" data-genre="Smut" data-rating="4.6">
  <img src="https://via.placeholder.com/300x420">
  <span class="badge">NEW</span>
  <p>Coming Soon</p>
  <p class="rate">⭐ 4.6</p>
</a>

</div>

<footer>
<p>Azure Manhwa</p>
<a href="https://t.me/+Yi-oZzIE-bplZWE9">Telegram</a> •
<a href="https://www.tiktok.com/@shereebourgade">TikTok</a>
</footer>

<script>
const search = document.getElementById("search");
const genre = document.getElementById("genre");
const rating = document.getElementById("rating");
const sort = document.getElementById("sort");
const warn = document.getElementById("warn");
const list = document.getElementById("list");

let cards = Array.from(document.querySelectorAll(".card"));

function filter(){
  const q = search.value.toLowerCase();
  const g = genre.value;
  const r = parseFloat(rating.value);

  cards.forEach(c=>{
    const title = c.innerText.toLowerCase();
    const cg = c.dataset.genre;
    const cr = parseFloat(c.dataset.rating);

    const ok =
      title.includes(q) &&
      (!g || g === cg) &&
      cr >= r;

    c.style.display = ok ? "block" : "none";
  });

  warn.style.display =
    g === "Smut" || g === "Adult" ? "block" : "none";

  sortCard();
}

function sortCard(){
  let visible = cards.filter(c=>c.style.display !== "none");
  if(sort.value === "rate"){
    visible.sort((a,b)=>b.dataset.rating - a.dataset.rating);
  }
  visible.forEach(c=>list.appendChild(c));
}

search.oninput = filter;
genre.onchange = filter;
rating.onchange = filter;
sort.onchange = filter;
</script>

</body>
</html>
